[package]
name = "oa04-dependency-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
blake3 = { version = "=1.8.6", default-features = false, features = ["std"] }
clap = { version = "=4.6.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json"] }
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "net", "process", "rt", "signal", "sync", "time"] }
